name: ci

on:
  push:
  pull_request:

jobs:
  # 纯单元测试：版本策略矩阵、api.go 边界校验、生成脚本一致性，无需动态库
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: api.go freshness check
        run: python3 scripts/gen_api_go.py --check
      - name: unit tests (e2e auto-skips without library)
        run: go test ./...

  # 端到端矩阵：windows / linux(x64+arm64) / macOS(arm64) × onnxruntime 1.23 ~ 1.31 每个大版本
  e2e:
    strategy:
      fail-fast: false
      matrix:
        target:
          - {runner: windows-latest,     asset: win-x64}       # x64
          - {runner: ubuntu-latest,      asset: linux-x64}     # x64
          - {runner: ubuntu-24.04-arm,   asset: linux-aarch64} # arm64
          - {runner: macos-latest,       asset: osx-arm64}     # Apple Silicon arm64
        ort: ["1.23.2", "1.24.4", "1.25.1", "1.26.0", "1.27.1", "1.28.3", "1.29.1", "1.30.1", "1.31.1"]
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"

      - name: download onnxruntime ${{ matrix.ort }}
        shell: bash
        env:
          ORT_VERSION: ${{ matrix.ort }}
          ASSET_OS: ${{ matrix.target.asset }}
        run: |
          set -euo pipefail
          EXT="tgz"
          case "$ASSET_OS" in win-*) EXT="zip" ;; esac
          url="https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-${ASSET_OS}-${ORT_VERSION}.${EXT}"
          echo "downloading $url"
          curl -sSL --retry 3 -o "/tmp/ort.${EXT}" "$url"
          mkdir -p "lib/${ORT_VERSION}"
          tar -xf "/tmp/ort.${EXT}" -C /tmp
          cp "/tmp/onnxruntime-${ASSET_OS}-${ORT_VERSION}/lib/"* "lib/${ORT_VERSION}/"

      - name: download model & test image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p examples/yolo/testdata
          if [ ! -f examples/yolo/testdata/yolo11n.onnx ]; then
            curl -sSL --retry 3 -o examples/yolo/testdata/yolo11n.onnx \
              "https://github.com/ultralytics/assets/releases/download/v8.3.0/yolo11n.onnx"
          fi
          if [ ! -f examples/yolo/testdata/bus.jpg ]; then
            curl -sSL --retry 3 -o examples/yolo/testdata/bus.jpg \
              "https://ultralytics.com/images/bus.jpg"
          fi

      - name: go test (unit + yolo e2e on ${{ matrix.ort }})
        run: go test -v ./...

      - name: go test -race (root package)
        if: runner.os != 'windows'
        run: go test -race ./...
